<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试结果通知</title>
<style>
  :root{
    --bg:#0b1016; --panel:#121a24; --line:#1f2b3a; --text:#e6edf3; --muted:#8b98a9;
    --pass:#22c55e; --fail:#ef4444; --info:#60a5fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#16283d 0%,var(--bg) 60%);
    color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:12px 24px;border-bottom:1px solid var(--line);
    background:rgba(18,26,36,.75);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10;
  }
  .brand{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .brand .sub{font-size:12px;font-weight:400;color:var(--muted);margin-left:10px}
  .stats{display:flex;gap:10px;margin-left:auto}
  .stat{min-width:92px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
  .stat b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.5px}
  #statPass{color:var(--pass)}
  #statFail{color:var(--fail)}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{
    background:#1b2735;color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:background .15s;
  }
  button:hover{background:#22334a}
  .dot{width:9px;height:9px;border-radius:50%;background:#6b7280;display:inline-block}
  .dot.on{background:var(--pass);box-shadow:0 0 10px var(--pass)}
  .dot.off{background:var(--fail)}
  .conn{font-size:12px;color:var(--muted);margin-right:6px}
  main{max-width:1280px;margin:0 auto;padding:22px}
  .hero{
    border-radius:18px;padding:26px 32px;border:1px solid var(--line);
    background:linear-gradient(180deg,#141f2b,#0f1720);
    display:flex;flex-direction:column;gap:10px;transition:box-shadow .25s,border-color .25s;
  }
  .hero.pass{border-color:rgba(34,197,94,.55);box-shadow:0 0 40px rgba(34,197,94,.12)}
  .hero.fail{border-color:rgba(239,68,68,.65);box-shadow:0 0 50px rgba(239,68,68,.18)}
  .hero-result{
    font-size:clamp(56px,11vw,132px);font-weight:800;line-height:.95;
    letter-spacing:4px;font-variant-numeric:tabular-nums;
  }
  .hero.pass .hero-result{color:var(--pass);text-shadow:0 0 40px rgba(34,197,94,.35)}
  .hero.fail .hero-result{color:var(--fail);text-shadow:0 0 40px rgba(239,68,68,.35)}
  .hero.idle .hero-result{color:#4a5870;font-size:clamp(30px,5vw,52px);letter-spacing:2px}
  .hero-meta{display:flex;gap:8px 22px;flex-wrap:wrap;color:var(--muted);font-size:15px;min-height:22px}
  .hero-meta b{color:#cbd5e1;font-weight:600}
  .table-wrap{
    margin-top:18px;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;background:var(--panel);
  }
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{
    background:#16202c;color:var(--muted);font-weight:600;text-align:left;
    padding:10px 14px;border-bottom:1px solid var(--line);
    font-size:12px;letter-spacing:.5px;position:sticky;top:60px;
  }
  tbody td{padding:9px 14px;border-bottom:1px solid rgba(31,43,58,.6);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px}
  .badge.pass{background:rgba(34,197,94,.15);color:var(--pass)}
  .badge.fail{background:rgba(239,68,68,.15);color:var(--fail)}
  .badge.info{background:rgba(96,165,250,.15);color:var(--info)}
  .mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
  .muted{color:var(--muted)}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
  body.flash-fail::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
    border:8px solid var(--fail);animation:flashfade 1.2s ease-out;
  }
  @keyframes flashfade{0%{opacity:1}100%{opacity:0}}
  @media (max-width:760px){
    .brand .sub{display:none}
    .stats{width:100%;margin-left:0}
    .stat{flex:1;min-width:0}
    th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}
    main{padding:14px}
    .hero{padding:20px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">测试结果通知<span class="sub" id="addr"></span></div>
  <div class="stats">
    <div class="stat"><b id="statPass">0</b><span>PASS</span></div>
    <div class="stat"><b id="statFail">0</b><span>FAIL</span></div>
    <div class="stat"><b id="statTotal">0</b><span>总数</span></div>
  </div>
  <div class="tools">
    <span id="dot" class="dot"></span><span id="conn" class="conn">连接中…</span>
    <button id="btnSound" type="button">声音：开</button>
    <button id="btnFilter" type="button">显示：全部</button>
    <button id="btnClear" type="button">清空</button>
    <button id="btnFs" type="button">全屏</button>
  </div>
</header>
<main>
  <section id="hero" class="hero idle">
    <div class="hero-result" id="heroResult">等待结果</div>
    <div class="hero-meta" id="heroMeta"></div>
  </section>
  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:150px">时间</th>
          <th style="width:90px">结果</th>
          <th style="width:120px">工位</th>
          <th style="width:170px">序列号</th>
          <th>备注</th>
          <th style="width:140px">来源</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">还没有收到测试结果</div>
  </section>
</main>

<script>
(function () {
  var lastTotal = -1;
  var showAll = true;
  var soundOn = true;
  var audioCtx = null;
  var online = null;

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function unlockAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { }
  }

  function tone(freq, start, dur) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      var t0 = audioCtx.currentTime + start;
      o.start(t0); o.stop(t0 + dur);
    } catch (e) { }
  }

  function alarm() {
    if (!soundOn) return;
    unlockAudio();
    tone(880, 0, 0.16);
    tone(660, 0.2, 0.16);
    tone(880, 0.4, 0.16);
  }

  function flash() {
    document.body.classList.remove("flash-fail");
    void document.body.offsetWidth;
    document.body.classList.add("flash-fail");
    setTimeout(function () { document.body.classList.remove("flash-fail"); }, 1200);
  }

  function setConn(ok) {
    if (online === ok) return;
    online = ok;
    $("dot").className = "dot " + (ok ? "on" : "off");
    $("conn").textContent = ok ? "已连接" : "连接断开";
  }

  function fmtTime(t) {
    if (!t) return "";
    return t.length > 10 ? t.substring(5) : t;
  }

  function update(s) {
    if (lastTotal >= 0 && s.total > lastTotal && s.latest === "FAIL") {
      alarm();
      flash();
    }
    lastTotal = s.total;

    $("statPass").textContent = s.pass;
    $("statFail").textContent = s.fail;
    $("statTotal").textContent = s.total;

    var hero = $("hero");
    var state = s.latest === "PASS" ? "pass" : s.latest === "FAIL" ? "fail" : "idle";
    hero.className = "hero " + state;
    $("heroResult").textContent = s.latest === "PASS" ? "PASS" : s.latest === "FAIL" ? "FAIL" : "等待结果";

    var meta = $("heroMeta");
    while (meta.firstChild) meta.removeChild(meta.firstChild);
    var rec = s.records && s.records[0];
    if (!rec) {
      meta.appendChild(el("span", null, "暂无数据"));
    } else {
      var pairs = [
        ["工位", rec.station],
        ["SN", rec.sn],
        ["备注", rec.msg],
        ["时间", fmtTime(rec.time)],
        ["来源", rec.ip]
      ];
      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i][1]) continue;
        var sp = el("span");
        sp.appendChild(el("b", null, pairs[i][0] + "："));
        sp.appendChild(document.createTextNode(pairs[i][1]));
        meta.appendChild(sp);
      }
    }

    var rows = $("rows");
    while (rows.firstChild) rows.removeChild(rows.firstChild);

    var list = (s.records || []).filter(function (r) {
      return showAll || r.result === "FAIL";
    });

    var shown = list.slice(0, 200);
    for (var j = 0; j < shown.length; j++) {
      var r = shown[j];
      var tr = document.createElement("tr");
      tr.appendChild(el("td", "mono muted", fmtTime(r.time)));
      var tdRes = el("td");
      tdRes.appendChild(el("span", "badge " + String(r.result).toLowerCase(), r.result));
      tr.appendChild(tdRes);
      tr.appendChild(el("td", null, r.station || ""));
      tr.appendChild(el("td", "mono", r.sn || ""));
      tr.appendChild(el("td", null, r.msg || ""));
      tr.appendChild(el("td", "mono muted", r.ip || ""));
      rows.appendChild(tr);
    }

    var empty = $("empty");
    empty.style.display = list.length ? "none" : "block";
    empty.textContent = showAll ? "还没有收到测试结果" : "没有 FAIL 记录";
  }

  function poll() {
    fetch("/api/state?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (s) { update(s); setConn(true); })
      .catch(function () { setConn(false); });
  }

  $("btnSound").addEventListener("click", function () {
    soundOn = !soundOn;
    this.textContent = "声音：" + (soundOn ? "开" : "关");
    if (soundOn) { unlockAudio(); tone(880, 0, 0.1); }
  });

  $("btnFilter").addEventListener("click", function () {
    showAll = !showAll;
    this.textContent = "显示：" + (showAll ? "全部" : "仅 FAIL");
    poll();
  });

  $("btnClear").addEventListener("click", function () {
    if (!confirm("确定清空所有统计和历史记录吗？(results.csv 日志不会被删除)")) return;
    fetch("/api/clear?t=" + Date.now(), { cache: "no-store" })
      .then(function () { lastTotal = -1; poll(); })
      .catch(function () { });
  });

  $("btnFs").addEventListener("click", function () {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  });

  document.addEventListener("click", unlockAudio, { once: true });

  $("addr").textContent = location.host;

  poll();
  setInterval(poll, 800);
})();
</script>
</body>
</html>
